<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Argo">
  <!--
    The tab icon. Sits at the app root rather than inside a route group so it
    covers the admin as well as the public site.

    The mark ships as white polygons on a transparent field, which disappears
    against a light tab strip — so it is set on the site's ink square here, with
    the brand yellow on the leading form to keep it legible at 16px, where the
    thin trailing shapes stop resolving at all.
  -->
  <rect width="512" height="512" rx="96" fill="#08090b" />
  <g transform="translate(6 98) scale(1.85)">
    <polygon fill="#ffb700" points="183.12 47.63 148.28 98.17 147.31 102.38 139.57 136.08 104.73 117.13 91 87.24 78.6 60.26 43.75 104.57 60.91 34.99 139.57 60.26 183.12 47.63" />
    <polygon fill="#f4f5f2" points="226.67 34.99 191.83 85.53 183.12 123.44 148.28 104.49 147.31 102.38 148.28 98.17 183.12 47.63 226.67 34.99" />
    <polygon fill="#f4f5f2" points="91 87.24 87.3 91.94 43.75 104.57 78.6 60.26 91 87.24" />
    <polygon fill="#f4f5f2" points="183.12 123.44 139.57 136.08 147.31 102.38 148.28 104.49 183.12 123.44" />
  </g>
</svg>
