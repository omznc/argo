# The whole deployment: the site, and a reverse proxy that gets its own TLS
# certificate. Nothing else is needed on the host beyond Docker itself.
#
#   cp .env.example .env    # then edit — PAYLOAD_SECRET and SITE_DOMAIN at minimum
#   docker compose up -d --build
#
# First boot only: set ARGO_SEED=true in .env to write the design copy into an
# empty database, then remove it so a deliberate deletion doesn't come back.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The canonical origin. Read by metadataBase, canonicals, the sitemap,
      # robots and the OG images — and inlined at build time, which is why the
      # container builds on startup rather than in the image.
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      DATABASE_URI: file:/data/argo.db
      MEDIA_DIR: /app/media
    volumes:
      # The database. This is the site's content — back this up.
      - argo-data:/data
      # Uploaded media. Also content, also worth backing up: Payload stores the
      # file here and only a row pointing at it in the database, so one without
      # the other is a library of broken images.
      - argo-media:/app/media
      # The build output and, inside it, Next's incremental cache. Persisted so
      # a page revalidated by an editor's publish survives a restart instead of
      # reverting to whatever the last build produced.
      - argo-next:/app/.next
    healthcheck:
      # /robots.txt is static, cheap, and served by the same process that serves
      # the site — a 200 here means Next is actually up, not just the container.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/robots.txt']
      # Generous, because a cold start runs migrations and a full build.
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - '3000'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Without this volume every restart
      # requests new certificates and will eventually hit Let's Encrypt's rate
      # limit — at which point the site is down until it expires.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  argo-data:
  argo-media:
  argo-next:
  caddy-data:
  caddy-config:
